id: persistence
name: Scheduled task persistence
trigger: Scheduled task created that runs a script or download
mitre: [T1053]
rules: [autosoc-schtask-persistence]
params:
  host: {required: true}
  task: {required: true, desc: "scheduled task name"}
  c2_ip: {required: false}
steps:
  - id: block_c2
    tool: firewall.block_ip
    when: c2_ip
    params: {indicator: "{c2_ip}", duration_h: 24}
    tier: 1
  - id: remove_task
    tool: edr.remove_persistence
    params: {host: "{host}", task: "{task}"}
    tier: 2
  - id: isolate_host
    tool: edr.isolate_host
    params: {host: "{host}", reason: "persistence installed"}
    tier: 2
    raise_if: {host_role: [server]}
