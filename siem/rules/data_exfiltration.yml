title: Large outbound transfer to a rare external destination
id: autosoc-data-exfiltration
status: test
level: high
tags: [attack.exfiltration, attack.t1048]
logsource: {category: network_flow}
detection:
  selection:
    event.action: network_flow
    network.direction: outbound
    network.bytes|gte: 500000000
  filter_internal:
    destination.ip|startswith: ["10.", "192.168.", "172.16."]
  condition: selection and not filter_internal
