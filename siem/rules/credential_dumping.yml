title: Credential dumping (Mimikatz-like) activity
id: autosoc-credential-dumping
status: test
level: critical
tags: [attack.credential_access, attack.t1003]
logsource: {product: windows, service: sysmon}
detection:
  sel_cmd:
    process.command_line|contains: ["sekurlsa::", "lsadump::", "privilege::debug"]
  sel_lsass:
    event.action: process_access
    process.target.name|endswith: lsass.exe
  filter_av:
    process.name: [MsMpEng.exe]
  condition: (sel_cmd or sel_lsass) and not filter_av
