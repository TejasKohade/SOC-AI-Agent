id: credential-dumping-01
mitre: T1003
description: Mimikatz-like test binary dumps LSASS on bob's workstation.
events:
  - event: {source: sysmon, event_id: 1, action: process_start, host: wks-bob-02, user: bob,
            process: mimi.exe, parent: cmd.exe, cmd: "mimi.exe privilege::debug sekurlsa::logonpasswords exit",
            hash: 5f4dcc3b5aa765d61d8327deb882cf99aa0e1c4f1e2d3c4b5a69788776655443}
  - after: 1s
    event: {source: sysmon, event_id: 10, action: process_access, host: wks-bob-02, user: bob,
            process: mimi.exe, target: lsass.exe}
noise: {benign_processes: 150, malformed: 3}
noise_hosts: [wks-bob-02, wks-alice-01]
expect:
  verdict: malicious
  actions: [edr.kill_process, edr.isolate_host]
  max_tier: 2
